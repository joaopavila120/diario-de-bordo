<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Diário e checklist das máquinas da fazenda, com QR code, revisões pelo horímetro e funcionamento sem internet.">
<meta name="theme-color" content="#1F5F2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diário de Bordo">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Diário de Bordo das Máquinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: uma tela por vez. Operador = celular centralizado; Dono = painel */
:root{
  --paper:#EEF2EC; --surface:#FFFFFF; --sunk:#E3E9E0; --ink:#152016; --ink-2:#56625A; --line:#D3DBCF;
  --brand:#1F5F2A; --brand-ink:#FFFFFF;
  --accent:#2E7D32; --accent-ink:#FFFFFF; --accent-soft:#E2EFE3; --accent-text:#256B2A;
  --gold:#FFC20E; --gold-ink:#1E1600; --on-warn:#1E1600;
  --ok:#2E8B3E; --ok-soft:#DDF0E0; --warn:#8A5A00; --warn-fill:#F5B400; --warn-soft:#FFF1C9;
  --bad:#D32F2F; --bad-soft:#FBE2E0; --na:#6B7568; --na-soft:#E3E8E1;
  --gauge:#152016; --gauge-ink:#EEF2EC; --bezel:#152016;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-app:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(21,32,22,.07),0 4px 14px rgba(21,32,22,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1310; --surface:#18201A; --sunk:#222C24; --ink:#E8EFE6; --ink-2:#9CA99B; --line:#2C392E;
  --brand:#1B4D24; --brand-ink:#FFFFFF;
  --accent:#2E7D32; --accent-ink:#FFFFFF; --accent-soft:#1A3A20; --accent-text:#7CC47F;
  --gold:#FFC20E; --gold-ink:#1E1600; --on-warn:#1E1600;
  --ok:#3E9B4F; --ok-soft:#14321C; --warn:#F5B400; --warn-fill:#F5B400; --warn-soft:#332709;
  --bad:#E5483B; --bad-soft:#3B1613; --na:#6F7B70; --na-soft:#253027;
  --gauge:#050805; --gauge-ink:#EEF2EC; --bezel:#050805;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1310; --surface:#18201A; --sunk:#222C24; --ink:#E8EFE6; --ink-2:#9CA99B; --line:#2C392E;
  --brand:#1B4D24; --brand-ink:#FFFFFF;
  --accent:#2E7D32; --accent-ink:#FFFFFF; --accent-soft:#1A3A20; --accent-text:#7CC47F;
  --gold:#FFC20E; --gold-ink:#1E1600; --on-warn:#1E1600;
  --ok:#3E9B4F; --ok-soft:#14321C; --warn:#F5B400; --warn-fill:#F5B400; --warn-soft:#332709;
  --bad:#E5483B; --bad-soft:#3B1613; --na:#6F7B70; --na-soft:#253027;
  --gauge:#050805; --gauge-ink:#EEF2EC; --bezel:#050805;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-app);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-app);font-stretch:100%;margin:0;line-height:1.1;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.label{font-family:var(--f-app);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--gold);display:grid;place-items:center}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.stage[data-view="panel"]{max-width:1320px}
.tabs{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:8px 18px;border-radius:999px;font-weight:650;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* palco */
.stage{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1100px;margin:0 auto}
.stage[data-view="op"] .panel,.stage[data-view="panel"] .phone-wrap{display:none}
.phone-wrap{display:flex;justify-content:center}
.phone{width:100%;max-width:400px}
.op{background:var(--paper);min-height:520px;border-radius:var(--r);overflow:hidden;overflow:clip}
@media (min-width:700px){
  .phone{background:var(--bezel);border-radius:42px;padding:11px;box-shadow:0 18px 50px rgba(10,15,25,.25)}
  .op{height:min(760px,calc(100vh - 120px));overflow-y:auto;border-radius:31px;scrollbar-width:thin}
}

/* comuns */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:10px 14px;font-weight:650;font-size:14.5px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent-text);color:var(--accent-ink)}
.btn.big{padding:16px;font-size:17px;width:100%;border-radius:var(--r)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-text);padding-inline:4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--na-soft);color:var(--na)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tico{width:44px;height:44px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none}
.tico svg{width:30px;height:30px;stroke-width:1.8}
.sev{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.sev svg{width:17px;height:17px;stroke-width:3}
.sev.ok{background:var(--ok-soft);color:var(--ok)} .sev.warn{background:var(--warn-fill);color:#2A1C00} .sev.bad{background:var(--bad);color:#fff} .sev.na{background:var(--na-soft);color:var(--na)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar.warn i{background:var(--warn-fill)} .bar.bad i{background:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:650;color:var(--ink-2)}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%;min-width:0}

/* mostrador do horímetro */
.gauge{display:inline-flex;align-items:stretch;gap:3px;background:var(--gauge);padding:6px;border-radius:8px}
.gauge b{font-family:var(--f-mono);font-weight:600;font-size:26px;line-height:1;color:var(--gauge-ink);background:linear-gradient(#2A3644,#1A222C 48%,#10161D 52%,#222C38);width:1.05em;padding:6px 0;text-align:center;border-radius:3px}
.gauge b.sep{background:none;width:.35em;color:#8D99A8}
.gauge .u{font-family:var(--f-display);font-stretch:80%;font-weight:700;color:var(--warn-fill);align-self:flex-end;padding:0 4px 4px 6px;font-size:15px}
</style>

</head>
<body>
<style>
/* celular do operador: padrão de apps de inspeção (cartões brancos, lista agrupada, barra inferior) */
.op{font-family:var(--f-app);font-size:15px}
.op h1,.op h2,.op h3{font-family:var(--f-app);font-stretch:100%}
.op .mono{font-family:var(--f-app);font-variant-numeric:tabular-nums}
.o-wrap{min-height:100%;display:flex;flex-direction:column}
@media (max-width:699px){.o-wrap{min-height:calc(100vh - 110px)}}
.o-screen{flex:1;display:flex;flex-direction:column}
.o-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:6px;min-height:58px;padding:6px 12px 6px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.o-top h2{flex:1;min-width:0;font-size:17px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o-top h2 small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.o-icon{border:0;background:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.o-icon:hover{background:var(--sunk)}
.o-gap{width:10px;flex:none}
.o-count{font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.o-progress{height:4px;background:var(--sunk)}
.o-progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.o-sig{border:0;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:6px 11px;border-radius:99px;background:var(--ok-soft);color:var(--ok);flex:none}
.o-sig i{width:8px;height:8px;border-radius:50%;background:currentColor}
.o-sig.off{background:var(--bad-soft);color:var(--bad)}
.o-hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 18px 4px}
.o-hello p{margin:0 0 2px;color:var(--ink-2);font-size:13.5px;font-weight:500}
.o-hello p::first-letter{text-transform:uppercase}
.o-hello h2{font-size:28px;font-weight:800;letter-spacing:-.02em}
.o-hello-r{display:flex;align-items:center;gap:8px}
.o-me{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.o-body{padding:14px 16px 22px;display:flex;flex-direction:column;gap:12px}
.o-card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.o-scan{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:18px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 28%,transparent)}
.o-scan-ico{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.o-scan-ico .ico{width:30px;height:30px}
.o-scan b{display:block;font-size:17px;font-weight:700}
.o-scan .o-txt small{display:block;font-size:13px;color:inherit;opacity:.85}
.o-txt{flex:1;min-width:0}
.o-txt b{display:block;font-size:15px;font-weight:650;line-height:1.3}
.o-txt small{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o-txt small.c-warn{color:var(--warn)} .o-txt small.c-bad{color:var(--bad)}
.o-sec{display:flex;align-items:baseline;justify-content:space-between;padding:10px 4px 0}
.o-sec h3{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.o-sec span{font-size:13px;color:var(--ink-2);font-weight:600}
.o-group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.o-cell{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 14px;position:relative}
.o-cell + .o-cell::before,.o-tip + .o-tip::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--line)}
button.o-cell:hover{background:var(--sunk)}
.o-cell > .ico{color:var(--ink-2);width:18px;height:18px}
.o-av{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.o-av svg{width:24px;height:24px;stroke-width:1.9}
.o-av.sm{width:36px;height:36px;border-radius:10px} .o-av.sm svg{width:19px;height:19px}
.o-av.lg{width:56px;height:56px;border-radius:15px} .o-av.lg svg{width:34px;height:34px}
.o-av.ok{background:var(--ok-soft);color:var(--ok)} .o-av.warn{background:var(--warn-soft);color:var(--warn)} .o-av.bad{background:var(--bad-soft);color:var(--bad)}
.o-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:4px 10px;border-radius:99px;background:var(--na-soft);color:var(--na);white-space:nowrap;flex:none}
.o-badge .ico{width:14px;height:14px}
.o-badge.ok{background:var(--ok-soft);color:var(--ok)} .o-badge.warn{background:var(--warn-soft);color:var(--warn)} .o-badge.bad{background:var(--bad-soft);color:var(--bad)} .o-badge.q{background:var(--accent-soft);color:var(--accent-text)}
.o-queue{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);font-weight:600;font-size:14px}
.o-mach{padding:16px;display:flex;flex-direction:column;gap:14px}
.o-mach-h{display:flex;align-items:center;gap:12px}
.o-mach-h .o-txt b{font-size:18px;font-weight:700}
.o-stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:12px}
.o-stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.o-stats div + div{border-left:1px solid var(--line);padding-left:14px}
.o-stats small{font-size:12.5px;color:var(--ink-2);font-weight:500}
.o-stats b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.o-rev{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.o-rev-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.o-rev-h small{font-size:12.5px;color:var(--ink-2);font-weight:600}
.o-rev > small{font-size:13px;font-weight:600}
.o-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:700;font-size:16px;position:relative}
.o-btn.primary{background:var(--accent);color:var(--accent-ink)}
.o-btn.ok{background:var(--ok-soft);color:var(--ok)}
.o-btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.o-btn.sm{width:auto;padding:9px 12px;font-size:14px;border-radius:10px}
.o-btn[disabled]{opacity:.45;cursor:not-allowed}
.o-btn input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}
.o-hm{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.o-hm label{font-size:13px;font-weight:650;color:var(--ink-2)}
.o-hm-in{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:2px 14px;background:var(--paper)}
.o-hm-in:focus-within{border-color:var(--accent-text)}
.o-hm-in input{flex:1;min-width:0;border:0;background:none;font-size:24px;font-weight:700;padding:9px 0;outline:none;font-variant-numeric:tabular-nums}
.o-hm-in span{font-weight:700;color:var(--ink-2)}
.o-hm small{font-size:12.5px;color:var(--ink-2)}
.o-q{padding:14px;display:flex;flex-direction:column;gap:12px;border-width:1.5px}
.o-q p{margin:0;font-weight:600;font-size:15px;line-height:1.35}
.o-q[data-s="warn"]{border-color:var(--warn-fill)} .o-q[data-s="bad"]{border-color:var(--bad)}
.o-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.o-seg button{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:650;font-size:13.5px;color:var(--ink-2)}
.o-seg button .ico{width:16px;height:16px;stroke-width:2.6}
.o-seg button[data-v="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.o-seg button[data-v="warn"][aria-pressed="true"]{background:var(--warn-fill);border-color:var(--warn-fill);color:#2A1C00}
.o-seg button[data-v="bad"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.o-seg button[data-v="na"][aria-pressed="true"]{background:var(--na);border-color:var(--na);color:#fff}
.o-extra{display:flex;flex-direction:column;gap:8px}
.o-extra textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);resize:vertical;width:100%}
.o-photo{display:flex;align-items:center;gap:10px}
.o-photo img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.o-foot{position:sticky;bottom:0;z-index:5;margin-top:auto;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.o-done{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:18px 0 6px}
.o-done-ico{width:80px;height:80px;border-radius:50%;display:grid;place-items:center}
.o-done-ico svg{width:40px;height:40px;stroke-width:2.6}
.o-done-ico.ok{background:var(--ok);color:#fff} .o-done-ico.warn{background:var(--warn-fill);color:#2A1C00} .o-done-ico.bad{background:var(--bad);color:#fff}
.o-done h2{font-size:22px;font-weight:800}
.o-done small{color:var(--ink-2);font-size:13px}
.o-kv{padding:2px 16px}
.o-kv div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}
.o-kv div:first-child{border-top:0}
.o-kv span{color:var(--ink-2)}
.o-empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:56px 20px;color:var(--ink-2)}
.o-empty > span{width:64px;height:64px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;margin-bottom:6px}
.o-empty > span .ico{width:28px;height:28px}
.o-empty b{color:var(--ink);font-size:16px}
.o-tip{padding:14px 16px;display:flex;gap:12px;position:relative}
.o-tip .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.o-tip b{display:block;margin-bottom:2px}
.o-tip p{margin:0;font-size:14px;color:var(--ink-2)}
.o-calc{padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.o-calc .field input{background:var(--paper)}
.o-calc .res{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;background:var(--accent-soft);color:var(--accent-text);border-radius:12px;padding:12px 14px;font-weight:600}
.o-calc .res b{font-size:26px;font-variant-numeric:tabular-nums}
.o-hist{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.o-hist-h{display:flex;justify-content:space-between;gap:10px}
.o-hist p{margin:0;font-size:14px}

}

async function downloadSticker(mid){
  if (!downloadsApi && window.claude) return;
  const m = mach(mid), W = 600, H = 800, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  try { await document.fonts.ready; } catch(e){}
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.strokeStyle = "#111"; g.lineWidth = 12; g.strokeRect(6, 6, W - 12, H - 12);
  g.fillStyle = "#1F5F2A"; g.fillRect(36, 36, W - 72, 74);
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "800 34px Archivo, 'Arial Narrow', Arial, sans-serif"; g.fillText("CHECKLIST ANTES DE LIGAR", W / 2, 74); g.fillStyle = "#111";
  if (typeof qrcode === "function") {
    const q = qrcode(0, "M"); q.addData(qrText(m)); q.make();
    const n = q.getModuleCount(), cell = Math.floor(440 / n), size = cell * n, x0 = (W - size) / 2, y0 = 140;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect(x0 + c * cell, y0 + r * cell, cell, cell);
  }
  g.font = "800 56px Archivo, 'Arial Narrow', Arial, sans-serif"; g.fillText(m.name, W / 2, 650);
  g.font = "600 30px 'IBM Plex Mono', Consolas, monospace"; g.fillText(m.id.toUpperCase(), W / 2, 715);
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  if (!downloadsApi) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `etiqueta-${m.id}.png`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast("Etiqueta baixada"); return; }
  try { await downloadsApi.save({filename:`etiqueta-${m.id}.png`, data:blob}); toast("Etiqueta salva"); }
  catch(e){ if (e && e.code !== "declined") toast("Não foi possível baixar aqui."); }
}

    fr.onload = () => { const img = new Image();
      img.onload = () => { const s = Math.min(1, 480 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .72)); };
      img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file); });
}
function submitCk(){
  const ck = ui.op.ck, m = mach(ck.mid), cur = current(m, "device");
  const v = parseInt(String(ck.counter).replace(/\D/g, ""), 10);
  let err = "";
  if (isNaN(v)) err = `Informe o ${counterName(m).toLowerCase()}.`;
  else if (v < cur) err = `Menor que a última leitura (${fmt(cur)} ${U(m)}).`;
  else if (v > cur + m.perDay * 30) err = `Muito acima da última leitura (${fmt(cur)} ${U(m)}).`;
  if (err) { ui.op.err = err; renderOp(); $("#op").scrollTop = 0; window.scrollTo(0, 0); setTimeout(() => $("#ck-counter") && $("#ck-counter").focus(), 50); return; }
  const rec = {id:uid("c"), mid:m.id, kind:ck.kind, tpl:ck.tpl, at:new Date().toISOString(), op:S.operator, counter:v, answers:JSON.parse(JSON.stringify(ck.answers)), synced:false};
  extraOf(m.id, ck.kind).forEach(it => { const a = rec.answers[it[0]]; if (a) { a.label = it[1]; if (it[4]) a.unit = it[4]; } });
  S.checklists.push(rec);
  Object.assign(ui.op, {done:rec.id, ck:null, scr:"done", err:""});
  save(); renderAll();
  if (ui.online) sync();
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase(), m = mach(h);
  if (m) { Object.assign(ui.op, {mid:m.id, scr:"machine"}); ui.view = "op"; }
  else if (h === "dono") ui.view = "panel";
}

document.addEventListener("click", e => {
  if (e.target.id === "sheet") return closeSheet();
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, d = t.dataset;
  switch (a) {
    case "view": ui.view = d.v; renderTop(); window.scrollTo(0, 0); break;
    case "net": setOnline(!ui.online); break;
    case "go": ui.op.scr = d.scr; ui.op.err = ""; renderOp(); break;
    case "open-hist": closeSheet(); Object.assign(ui.op, {mid:d.mid, scr:"hist", err:""}); renderOp(); break;
    case "open-m": closeSheet(); Object.assign(ui.op, {mid:d.mid, scr:"machine", err:""}); renderOp(); break;
    case "start-ck": { const m = mach(ui.op.mid), tpl = d.kind === "oper" ? TYPES[m.type].oper : TYPES[m.type].daily;
      ui.op.ck = {mid:m.id, kind:d.kind, tpl, counter:"", answers:{}}; ui.op.scr = "check"; ui.op.err = ""; renderOp(); break; }
    case "ans": { const ck = ui.op.ck, prev = ck.answers[d.id] || {};
      ck.answers[d.id] = (d.v === "warn" || d.v === "bad") ? {...prev, s:d.v} : {s:d.v}; renderOp();
      if (d.v === "warn" || d.v === "bad") setTimeout(() => { const n = $("#n-" + d.id); if (n) n.focus({preventScroll:true}); }, 0);
      break; }
    case "submit-ck": submitCk(); break;
    case "rev-form": revForm(d.mid, d.from); break;
    case "rev-save": saveRev(d.mid, d.from); break;
    case "ck-detail": ckDetail(d.cid); break;
    case "p-open": closeSheet(); if (!ui.panel.mid) ui.panel.from = ui.panel.sec; ui.panel.mid = d.mid; ui.view = "panel"; renderTop(); renderPanel(); window.scrollTo(0, 0); break;
    case "p-back": ui.panel.mid = null; ui.panel.sec = ui.panel.from || "machines"; renderPanel(); window.scrollTo(0, 0); break;
    case "p-nav": closeSheet(); ui.panel.mid = null; ui.panel.sec = d.sec; renderPanel(); window.scrollTo(0, 0); break;
    case "svc-filter": ui.panel.filter = d.v; renderPanel(); break;
    case "ck-filter": ui.panel.ckf = d.v; renderPanel(); break;
    case "item-add": itemForm(d.mid, d.kind); break;
    case "item-save": saveItem(d.mid, d.kind); break;
    case "item-rm": { const e = ((S.extraItems || {})[d.mid] || {})[d.kind]; if (e) { S.extraItems[d.mid][d.kind] = e.filter(i => i[0] !== d.id); save(); renderAll(); toast("Item removido"); } break; }
    case "qr-all": qrAll(); break;
    case "dl-sticker": downloadSticker(d.mid); break;
    case "sheet-close": closeSheet(); break;
    case "add-form": newVehicle("plt"); break;
    case "add-type": readAddForm(); ui.add.type = d.v; ui.add.plan = defaultPlan(d.v); ui.add.adding = false; addForm(); break;
    case "add-plan": readAddForm(); ui.add.adding = true; addForm(); break;
    case "add-plan-cancel": readAddForm(); ui.add.adding = false; addForm(); break;
    case "add-plan-ok": { const it = readPlanFields(ui.add.type === "cam" ? "km" : "h"); if (!it) break;
      readAddForm(); ui.add.plan.push({id:"x" + Date.now().toString(36), ...it}); ui.add.adding = false; addForm(); break; }
    case "add-rm": readAddForm(); ui.add.plan = ui.add.plan.filter(p => p.id !== d.id); addForm(); break;
    case "plan-add": planForm(d.mid); break;
    case "plan-save": savePlanItem(d.mid); break;
    case "add-save": saveVehicle(); break;
    case "copy-link": copyLink(t, d.mid); break;
    case "open-op": closeSheet(); ui.view = "op"; Object.assign(ui.op, {mid:d.mid, scr:"machine", err:""}); renderAll(); window.scrollTo(0, 0); break;
    case "reset":
      if (!ui.resetArm) { ui.resetArm = true; renderPanel(); setTimeout(() => { ui.resetArm = false; renderPanel(); }, 4000); }
      else { S = seed(); S.seededOn = new Date().toDateString(); applyCustom(); ui.resetArm = false; Object.assign(ui.op, {scr:"home", ck:null, done:null, err:""}); ui.panel.mid = null; save(); renderAll(); toast("Demonstração reiniciada"); }
      break;
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.name === "np-kind") { const w = $("#np-unit-wrap"); if (w) w.hidden = t.value !== "num"; return; }
  if (t.dataset && t.dataset.photo && t.files && t.files[0]) {
    try { const url = await readPhoto(t.files[0]); const ck = ui.op.ck; if (!ck) return; ck.answers[t.dataset.photo] = {...(ck.answers[t.dataset.photo] || {}), photo:url}; renderOp(); }
    catch(err){ toast("Não consegui abrir essa foto."); }
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.valCk && ui.op.ck) { const v = t.value.trim(), ck = ui.op.ck; if (v) ck.answers[t.dataset.valCk] = {s:"ok", val:v}; else delete ck.answers[t.dataset.valCk]; updateCkProgress(); }
  else if (t.dataset && t.dataset.val) { const cb = document.querySelector(`[data-svc="${t.dataset.val}"]`); if (cb && t.value.trim()) cb.checked = true; }
  else if (t.id === "ck-counter" && ui.op.ck) ui.op.ck.counter = t.value;
  else if (t.dataset && t.dataset.note && ui.op.ck) { const ck = ui.op.ck; ck.answers[t.dataset.note] = {...(ck.answers[t.dataset.note] || {}), note:t.value}; }
  else if (t.hasAttribute && t.hasAttribute("data-calc")) updateCalc();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
window.addEventListener("online", () => setOnline(true, true));
window.addEventListener("offline", () => setOnline(false, true));
window.addEventListener("hashchange", () => { route(); renderAll(); });

/* ---------- início ---------- */
S = load();
if (!S || S.seededOn !== new Date().toDateString() || S.sv !== SEED_V) {
  const old = S, keep = (old && old.custom) || [], ids = keep.map(m => m.id);
  S = seed(); S.seededOn = new Date().toDateString(); S.custom = keep; S.extraPlan = (old && old.extraPlan) || {}; S.extraItems = (old && old.extraItems) || {};
  if (old) S.revisions.push(...old.revisions.filter(r => ids.includes(r.mid)));
}
S.custom = S.custom || [];
applyCustom();
ui.online = navigator.onLine !== false;
route(); renderAll(); save();
(async () => { try { if (window.claude && window.claude.use) { downloadsApi = await window.claude.use("downloads"); if (downloadsApi) renderPanel(); } } catch(e){} })();
</script>

<script>
/* funciona sem internet: guarda o app no aparelho depois do primeiro acesso */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
